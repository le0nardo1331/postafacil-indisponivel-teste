<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página indisponível no momento</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f7f8; --fg:#18181b; --muted:#71717a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f11; --fg:#f4f4f5; --muted:#a1a1aa; } }
  html,body { height:100%; margin:0; }
  body { display:grid; place-items:center; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 16px; text-align:center; }
  h1 { font-size:clamp(1.5rem,5vw,2rem); font-weight:600; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0; font-size:1rem; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>Página indisponível no momento</h1>
  <p>Volte mais tarde.</p>
</main>
</body>
</html>
